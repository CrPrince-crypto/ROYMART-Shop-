<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Shop — ROYMART</title><link rel="stylesheet" href="./assets/css/style.css" /><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></head>
<body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="./index.html"><span class="brand-mark"></span><span>ROYMART</span></a><nav class="nav-links"><a href="./index.html">Home</a><a href="./shop.html">Shop</a><a href="./wishlist.html">Wishlist</a><a href="./cart.html">Cart</a><a href="./checkout.html">Checkout</a></nav><div class="nav-actions"><button class="icon-btn" data-login-open>☺</button><button class="icon-btn" data-open-cart>🛍 <span data-cart-count style="margin-left:4px;font-size:.8rem"></span></button></div></div></header>
<main class="container section">
  <div class="section-head"><div><h1 class="section-title">Shop premium</h1><p class="section-sub">Search, filter, sort, quick view, and add to cart with smooth motion.</p></div></div>
  <div class="toolbar"><input class="search" data-search placeholder="Search products..." /><select class="select" data-category><option>All</option><option>Hoodies</option><option>Sneakers</option><option>T-Shirts</option><option>Jackets</option><option>Watches</option><option>Techwear</option><option>Accessories</option></select><select class="select" data-sort><option value="featured">Featured</option><option value="priceLow">Price: Low to High</option><option value="priceHigh">Price: High to Low</option><option value="rating">Top Rated</option></select></div>
  <div class="grid" data-product-grid></div>
</main>
<div class="drawer" data-cart-drawer><div class="drawer-head"><strong>Cart</strong><button class="icon-btn" data-close="[data-cart-drawer]">×</button></div><div class="drawer-body" data-cart-list></div><div class="drawer-foot"><div class="summary-item"><span>Subtotal</span><strong data-cart-subtotal>₹0</strong></div><div class="summary-item"><span>Delivery</span><strong data-cart-delivery>₹0</strong></div><div class="total"><span>Total</span><span data-cart-total>₹0</span></div><a class="btn primary" style="width:100%;margin-top:14px" href="./checkout.html">Go to checkout</a></div></div>
<div class="modal" data-product-modal><div class="modal-box"><div class="modal-head"><strong>Quick view</strong><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body product-view"><div class="gallery" data-modal-gallery></div><div data-modal-info></div></div></div></div>
<div class="modal" data-login-modal><div class="modal-box" style="max-width:560px"><div class="modal-head"><strong>Login / Signup</strong><button class="icon-btn" data-modal-close>×</button></div><div class="modal-body"><form class="panel" data-login-form><div class="form-grid"><input class="input full" name="name" placeholder="Full name" /><input class="input full" name="email" placeholder="Email address" /><input class="input full" type="password" name="password" placeholder="Password" /></div><button class="btn primary" style="margin-top:14px">Continue</button></form></div></div></div>
<div class="toasts"></div>
<script src="./assets/js/data.js"></script><script src="./assets/js/app.js"></script>
</body></html>
